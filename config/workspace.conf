# Multi-agent workspace configuration

# Tmux session name (override with: SESSION_NAME=myproject workspace.sh)
# Exported: every agent .sh script sources this file, then execs `claude` as
# a direct child — a plain (non-exported) assignment would never reach that
# child's own environment, breaking any Bash-tool command (e.g. notify.sh,
# run_in_watcher.sh) that references $SESSION_NAME from inside a claude session.
export SESSION_NAME="${SESSION_NAME:-multiagents}"

# Working directory for all agents (defaults to current directory)
export WORKSPACE_DIR="${WORKSPACE_DIR:-$(pwd)}"

# Absolute path to this multiagents-setup checkout, derived from the location of
# this config file (symlink-safe via `cd -P`). Agents run with cwd set to
# WORKSPACE_DIR (the user's project), so a relative `./scripts/dispatch.sh`
# would not resolve; the coordination scripts must be addressed absolutely as
# "$MULTIAGENTS_ROOT/scripts/...". Exported for the same reason as SESSION_NAME:
# agent .md instructions reference it from inside a claude Bash-tool command.
export MULTIAGENTS_ROOT="$(cd -P "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"

# Single window name that holds all 4 panes
WINDOW_NAME="workspace"

# Pane titles (top-left, top-right, bottom-left, bottom-right)
PANE_ORCHESTRATOR="orchestrator"
PANE_DEVELOPER="developer"
PANE_TESTER="tester"
PANE_DEBUGGER="debugger"

# UI theme colors (Catppuccin Mocha-inspired dark palette)
THEME_BG="#1e1e2e"
THEME_FG="#ffffff"
THEME_BORDER_FG="#45475a"
THEME_ACTIVE_FG="#89b4fa"
THEME_STATUS_BG="#181825"
THEME_STATUS_FG="#cdd6f4"
